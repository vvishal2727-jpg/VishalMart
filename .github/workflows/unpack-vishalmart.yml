name: Import VishalMart project source

on:
  push:
    paths:
      - ".bootstrap/zip.part01"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and extract source archive
        run: |
          mkdir -p /tmp/vishalmart
          cat .bootstrap/zip.part* > /tmp/vishalmart.zip
          unzip -q /tmp/vishalmart.zip -d /tmp/vishalmart
          cp -a /tmp/vishalmart/VishalMart/. .
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-vishalmart.yml
      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add VishalMart redesigned source and remove chatbot"
            git push origin HEAD:main
          fi
